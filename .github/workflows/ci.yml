name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # H-20 (2026-11-22): the install and the suite never ran on real
    # Windows or macOS — the CRLF fix was only ever verified by a
    # simulated-Windows test. The matrix runs the full suite on all
    # three, so a platform failure is caught here, not by a reviewer.
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov httpx
      - name: Run tests
        run: pytest -v --cov=kenryu_engine --cov=kenryu_core --cov-report=term-missing

  pip-audit:
    # H-09 (2026-11-22): the pinned dependencies were verified clean
    # by a one-off pip-audit run; this job makes that check a guard, so
    # a future CVE in a pinned version fails the build. One OS is
    # enough for a dependency scan.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Audit pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip-audit -r requirements.txt

  gitleaks:
    # Secret scan over the full history: fail the build if a credential
    # ever reaches the repo, so a leak is caught before it is published.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  smoke:
    # Clean-clone install check: install the package from this checkout
    # and run the real CLI offline on the thesis panel. The deployed
    # service and the local CLI share the same engine, so this is the
    # install path a reviewer (or a colleague) would actually take.
    # The synthetic official index (tests/fixtures/) stands in for the
    # gitignored real one, so the official-format code path is exercised.
    # Matrix (2026-11-22): the install path is checked on all three
    # OSes; the steps run under bash (Git Bash on Windows) so the same
    # commands work everywhere.
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Reviewer path (examples, offline)
        # Runs FIRST, before the synthetic index is copied in: the
        # fresh checkout has no miRTarBase index (gitignored), so this
        # runs in reduced mode — the consensus genes must still match,
        # and the script prints the version it used.
        shell: bash
        run: python examples/verify_examples.py
      - name: CLI smoke test (thesis panel, offline)
        shell: bash
        run: |
          cp tests/fixtures/mirtarbase_official_synthetic.json.gz local_db/mirtarbase_official.json.gz
          printf 'hsa-miR-33a-5p\nhsa-miR-33b-5p\nhsa-miR-144-3p\nhsa-miR-758-3p\nhsa-miR-106b-5p\n' > /tmp/panel-tesis.txt
          kenryu /tmp/panel-tesis.txt --offline --out smoke-output
          python -c "import json; d=json.load(open('smoke-output/analysis.json')); assert sorted(d['common_genes'])==['ABCA1','KPNA3','SCN1A','SNTB2','TSC22D2'], d['common_genes']; g=d['validation']['genes']; assert g['ABCA1']['evidence_level']=='strong' and g['SNTB2']['evidence_level']=='weak', g; print('smoke: 5 thesis genes OK, ABCA1 strong / SNTB2 weak OK')"
