[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kenryu"
version = "1.49"
description = "KENRYU — miRNA target convergence and evidence platform (offline-first)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi==0.165.0",
    "uvicorn==0.27.0",
    "pandas==2.2.0",
    "numpy==1.26.3",
    "matplotlib==3.8.2",
    "seaborn==0.13.2",
    "matplotlib-venn==0.11.9",
    "httpx==0.26.0",
    "pydantic==2.14.3",
    "python-multipart==0.0.34",
    "scipy==1.12.0",
]

[project.scripts]
kenryu = "kenryu_cli:main"

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
py-modules = ["kenryu_engine", "kenryu_core", "kenryu_updater", "kenryu_cli"]
